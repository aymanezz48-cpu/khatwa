:root{
  /* One visual world: cream page, four colored cards you swipe through like stories. */
  --bg:#FBF5EA; --ink:#1D2430; --muted:#6E6B63; --sheet:#FFFDF8; --line:rgba(29,36,48,.09);
  --apricot:#FFC49A; --apricot-ink:#4B230C;
  --mint:#A9E5CB; --mint-ink:#0D3A2A;
  --blue:#AFCBFF; --blue-ink:#0E2A57;
  --night:#242C46; --night-ink:#FBF1E1; --night-acc:#FFC49A;
  --display:'Alexandria','Plex',system-ui,sans-serif; --body:'Plex','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.shell{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px;gap:12px}
.hello{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.3}
.date{color:var(--muted);font-size:.86rem}
.gear{width:44px;height:44px;border-radius:14px;border:0;background:rgba(29,36,48,.06);display:grid;place-items:center}
#banner:empty{display:none}
#banner{padding:0 20px 8px}
.ban{background:#fff;border-radius:18px;padding:12px 14px;font-size:.92rem;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 1px 0 var(--line)}
.ban b{font-weight:600}
.deck{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:4px 20px 8px;scrollbar-width:none;scroll-padding:0 20px}
.deck::-webkit-scrollbar{display:none}
.card{flex:0 0 88%;scroll-snap-align:center;border-radius:34px;padding:22px 20px 18px;position:relative;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.card::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;inset-inline-end:-90px;top:-110px;background:rgba(255,255,255,.28);pointer-events:none}
.card>*{position:relative}
.c-step{background:var(--apricot);color:var(--apricot-ink)}
.c-money{background:var(--mint);color:var(--mint-ink)}
.c-log{background:var(--blue);color:var(--blue-ink)}
.c-close{background:var(--night);color:var(--night-ink)}
.c-close::before{background:rgba(255,196,154,.12)}
.pill{align-self:flex-start;background:rgba(255,255,255,.55);border-radius:99px;padding:4px 12px;font-size:.8rem;font-weight:600}
.c-close .pill{background:rgba(255,255,255,.1)}
.label{font-size:.9rem;opacity:.8}
.huge{font-family:var(--display);font-weight:700;font-size:2.7rem;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:0}
.huge small{font-size:1.1rem;font-weight:600;margin-inline-start:6px}
.title{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.meta{font-size:.88rem;opacity:.75}
.grow{flex:1}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.kb{border:0;border-radius:18px;min-height:52px;padding:12px 18px;font-weight:600;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.kb.main{background:currentColor}
.kb.main span{color:var(--bg)}
.c-step .kb.main span{color:var(--apricot)} .c-money .kb.main span{color:var(--mint)} .c-log .kb.main span{color:var(--blue)} .c-close .kb.main{background:var(--night-acc)} .c-close .kb.main span{color:var(--night)}
.kb.soft{background:rgba(255,255,255,.55);color:inherit}
.c-close .kb.soft{background:rgba(255,255,255,.1)}
.kb.full{width:100%}
.kb:disabled{opacity:.4;cursor:not-allowed}
.kb.sm{min-height:40px;padding:8px 14px;font-size:.9rem;border-radius:14px}
.btns{display:flex;gap:8px}
.btns>.kb{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:rgba(255,255,255,.55);color:inherit;border-radius:99px;padding:8px 14px;font-size:.9rem;min-height:40px}
.chip.on{background:currentColor}
.chip.on span{color:var(--apricot)}
.c-close .chip{background:rgba(255,255,255,.1)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:rgba(255,255,255,.45);border-radius:18px;padding:10px 12px}
.mini .v{font-family:var(--display);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.mini .l{font-size:.78rem;opacity:.75}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.45);overflow:hidden;display:flex;justify-content:flex-start}
.bar i{display:block;height:100%;border-radius:9px;background:currentColor;opacity:.75}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:.95rem}
.c-close .line{border-color:rgba(255,255,255,.1)}
.line:last-child{border-bottom:0}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid currentColor;background:transparent;flex:none;opacity:.6;display:grid;place-items:center}
.note{background:rgba(255,255,255,.45);border-radius:16px;padding:10px 12px;font-size:.9rem}
.c-close .note{background:rgba(255,255,255,.08)}
.say{width:100%;min-height:110px;border:0;border-radius:22px;background:rgba(255,255,255,.7);padding:14px 16px;font-size:1.1rem;resize:none;outline:none;color:var(--blue-ink)}
.say::placeholder{color:rgba(14,42,87,.55)}
.say:focus{background:#fff}
.mic{width:52px;min-height:52px;flex:none;padding:0}
.mic.live{background:var(--night);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.6}}
.week{display:flex;gap:6px}
.week span{flex:1;aspect-ratio:1;max-width:40px;border-radius:12px;display:grid;place-items:center;font-size:.72rem;background:rgba(255,255,255,.08)}
.week span.on{background:var(--night-acc);color:var(--night);font-weight:600}
/* nav */
nav{display:flex;align-items:center;gap:10px;padding:6px 20px 12px}
.tabs{flex:1;display:flex;background:#fff;border-radius:22px;padding:5px;gap:4px;box-shadow:0 1px 0 var(--line)}
.tab{flex:1;border:0;background:transparent;border-radius:17px;min-height:46px;font-size:.84rem;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.tab.on{background:var(--dot);color:var(--ink)}
.tab.on i{background:var(--ink)}
.plus{width:60px;height:60px;border-radius:22px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px rgba(29,36,48,.25)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,25,35,.35);display:none;align-items:flex-end;justify-content:center;z-index:30}
.veil.open{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:30px 30px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0}
.sheet .kb.main{background:var(--ink)} .sheet .kb.main span{color:var(--bg)}
.sheet .kb.soft{background:rgba(29,36,48,.06)}
.sheet .chip{background:rgba(29,36,48,.06)}
.sheet .chip.on{background:var(--ink);color:var(--bg)}
.sheet .line{border-color:var(--line)}
.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);flex:1 1 120px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;min-height:50px;font-size:1rem;color:var(--ink);outline:none}
.in:focus{border-color:var(--ink)}
.in.need{border-color:#E8945A;background:#FFF3E8}
.amount{font-family:var(--display);font-weight:700;font-size:2.2rem;text-align:center;min-height:76px}
.draft{background:#fff;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.draft .sum{display:flex;align-items:center;gap:10px}
.draft .amt{font-family:var(--display);font-weight:700;white-space:nowrap}
.ask{color:#9A4A12;font-size:.9rem;font-weight:600}
.small{font-size:.86rem}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:18px;z-index:50;display:none;align-items:center;gap:10px;font-weight:600;max-width:90%}
.toast.show{display:flex;animation:pop .25s ease-out}
.toast button{border:0;background:rgba(255,255,255,.15);color:inherit;border-radius:10px;padding:4px 10px;font-weight:600}
@keyframes pop{from{transform:translate(-50%,12px);opacity:0}}
.ok{width:24px;height:24px;flex:none}
.ok circle{fill:var(--mint)} .ok path{fill:none;stroke:var(--mint-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:draw .35s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gone{animation:gone .35s ease-in forwards}
@keyframes gone{to{opacity:0;transform:translateX(-30px)}}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.c-close :focus-visible{outline-color:var(--night-acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ok path{stroke-dashoffset:0}}
@media (min-height:760px){.huge{font-size:3rem}.title{font-size:1.95rem}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="hello" id="hello">أهلًا</div><div class="date" id="date"></div></div>
    <button class="gear" data-act="settings" aria-label="الإعدادات" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div id="banner"></div>
  <main class="deck" id="deck">
    <section class="card c-step" id="step" aria-label="خطوة النهارده"></section>
    <section class="card c-money" id="money" aria-label="فلوسي"></section>
    <section class="card c-log" id="log" aria-label="سجّل"></section>
    <section class="card c-close" id="close" aria-label="قفلة اليوم"></section>
  </main>
  <nav>
    <div class="tabs" role="tablist">
      <button class="tab" style="--dot:var(--apricot)" data-act="goto" data-to="step" type="button"><i></i>خطوة</button>
      <button class="tab" style="--dot:var(--mint)" data-act="goto" data-to="money" type="button"><i></i>فلوسي</button>
      <button class="tab" style="--dot:var(--blue)" data-act="goto" data-to="log" type="button"><i></i>سجّل</button>
      <button class="tab" style="--dot:var(--night-acc)" data-act="goto" data-to="close" type="button"><i></i>القفلة</button>
    </div>
    <button class="plus" data-act="quickAdd" aria-label="سجّل بسرعة" type="button"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>
</div>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
function toLatin(s){ return String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.').replace(/[٬,]/g, ''); }
function numIn(v){ const x = parseFloat(toLatin(v)); return isFinite(x) ? x : null; }
function norm(s){ return toLatin(s).replace(/ـ/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase(); }
const nf = new Intl.NumberFormat('ar-EG', {maximumFractionDigits: 0});
const nf2 = new Intl.NumberFormat('ar-EG', {maximumFractionDigits: 2});
const n0 = n => nf.format(Math.round(Number(n) || 0));
const money = (n, cur) => cur === 'USD' ? nf2.format(r2(n)) + ' دولار' : n0(n) + ' جنيه';
function ymd(d = new Date()){ const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
const today = () => ymd();
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
function dayLabel(s){ if(!s) return 'من غير معاد'; const t = today(); if(s === t) return 'النهارده'; if(s === addDays(t, 1)) return 'بكرة'; if(s === addDays(t, -1)) return 'امبارح'; const d = pd(s); return `${DAYS[d.getDay()]} ${n0(d.getDate())} ${MONTHS[d.getMonth()]}`; }
function timeLabel(t){ if(!t) return ''; const [h, m] = t.split(':').map(Number); const hh = ((h + 11) % 12) + 1; return n0(hh) + (m ? ':' + nf.format(m).padStart(2, '٠') : '') + (h < 12 ? ' الصبح' : h < 15 ? ' الضهر' : h < 18 ? ' العصر' : ' بالليل'); }

/* ---------- categories ---------- */
const CATS = {
  food:{n:'أكل', k:['غدا','غداء','عشا','عشاء','فطار','اكل','مطعم','قهوه','كافيه','طلبات','دليفري','سندوتش','بيتزا','كشري','شاورما','حلويات']},
  home:{n:'البيت', k:['بيت','للبيت','مشتريات','سوبر','ماركت','خضار','فاكهه','لحمه','فراخ','تموين','منظفات','هايبر','بقاله']},
  car:{n:'العربية', k:['بنزين','عربيه','ميكانيكي','زيت','كاوتش','جراج','باركنج','اوبر','كريم','مواصلات','تاكسي','غسيل']},
  kids:{n:'الولاد', k:['ولاد','الولاد','اولاد','يحيي','سيرين','حفاضات','حضانه','مدرسه','لعب','العاب','التوام','لبن']},
  bills:{n:'فواتير', k:['فاتوره','كهربا','كهرباء','مياه','غاز','نت','انترنت','موبايل','رصيد','باقه','اشتراك','نتفليكس']},
  fun:{n:'خروجات', k:['خروجه','خروجات','فسحه','سينما','نادي','رحله','مصيف','ملاهي']},
  family:{n:'العيلة', k:['هديه','جدتي','ماما','بابا','اهلي','عزومه','عيديه','مراتي']},
  health:{n:'صحة وجيم', k:['جيم','صيدليه','دوا','دواء','دكتور','تحاليل','كشف']},
  clothes:{n:'لبس', k:['لبس','هدوم','جزمه','قميص','بنطلون','جاكت']},
  work:{n:'الشغل', k:['مصمم','للمصمم','المصمم','فريق','الفريق','مونتير','مونتاج','فريلانسر','كانفا','canva','adobe','اعلان','اعلانات','دومين','استضافه','شغل','للشغل','برنامج','برامج']},
  other:{n:'تاني', k:[]},
};
const INC = {salary:'المرتب', free:'شغل حر', other:'دخل تاني'};
const QUICK = [['food','أكل'],['car','بنزين'],['home','البيت'],['kids','الولاد'],['fun','خروجة'],['bills','فواتير'],['work','الشغل']];

/* ---------- storage: this phone only ---------- */
const KEY = 'khatwa_app_v1';
let D = {settings:{}, tx:[], tasks:[]};
function load(){ try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if(raw && typeof raw === 'object') D = Object.assign({settings:{}, tx:[], tasks:[]}, raw); } catch(e){} }
let saveOk = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(D)); saveOk = true; } catch(e){ saveOk = false; toast('مش قادر أحفظ على الموبايل. خد نسخة احتياطية من الإعدادات.'); } }
const ST = () => D.settings;
function setS(patch){ Object.assign(D.settings, patch); save(); }
const rate = () => Number(ST().rate) || 0;
const egp = t => t.currency === 'USD' ? t.amount * (Number(t.rate) || rate()) : Number(t.amount) || 0;

/* ---------- numbers ---------- */
function monthNums(mk = today().slice(0, 7)){
  const r = {inc:0, out:0, saved:0, cats:{}, salary:0, free:0};
  for(const t of D.tx){ if(!t.date || t.date.slice(0, 7) !== mk) continue; const v = egp(t);
    if(t.kind === 'income'){ r.inc += v; if(t.inc === 'salary') r.salary += v; if(t.inc === 'free') r.free += v; }
    else if(t.kind === 'expense'){ r.out += v; r.cats[t.cat] = (r.cats[t.cat] || 0) + v; }
    else if(t.kind === 'save') r.saved += v; }
  r.left = r.inc - r.out - r.saved; return r;
}
const dayTotal = d => D.tx.filter(t => t.date === d && t.kind === 'expense').reduce((s, t) => s + egp(t), 0);
function lastLogged(){ let m = ''; D.tx.forEach(t => { if(t.date > m && t.date <= today()) m = t.date; }); (ST().zeroDays || []).forEach(d => { if(d > m) m = d; }); return m; }
function loggedDay(d){ return D.tx.some(t => t.date === d) || (ST().zeroDays || []).includes(d); }

/* ---------- tasks ---------- */
const open = () => D.tasks.filter(t => t.status === 'open');
const score = t => (t.essential ? -100 : 0) + (t.due === today() ? -40 : 0) + (t.time ? -10 : 0) + (t.createdAt || 0) / 1e13;
function plan(){
  const t = today(); const o = open(); const busy = ST().busyDate === t;
  const pool = o.filter(x => !x.due || x.due === t).sort((a, b) => score(a) - score(b));
  const overdue = o.filter(x => x.due && x.due < t);
  let main = null;
  if(ST().todayMain?.date === t) main = o.find(x => x.id === ST().todayMain.id) || null;
  if(!main && ST().tomorrowMain?.date === t) main = o.find(x => x.id === ST().tomorrowMain.id) || null;
  if(!main) main = busy ? (pool.find(x => x.essential) || pool[0] || null) : (pool[0] || null);
  const extras = busy ? [] : pool.filter(x => x !== main).slice(0, 2);
  return {main, extras, overdue, busy, rest: pool.filter(x => x !== main && !extras.includes(x))};
}

/* ---------- parsing what he types ---------- */
const NUMW = [['ميتين',200],['تلتميه',300],['ربعميه',400],['خمسميه',500],['ستميه',600],['سبعميه',700],['تمنميه',800],['تسعميه',900],['الفين',2000],['ميه',100],['مية',100],['الف',1000]];
const WD = {'الاحد':0,'الحد':0,'الاتنين':1,'الاثنين':1,'التلات':2,'الثلاثاء':2,'الاربع':3,'الاربعاء':3,'الخميس':4,'الجمعه':5,'السبت':6};
const nextWd = n => { const d = pd(today()); let a = (n - d.getDay() + 7) % 7; if(!a) a = 7; return addDays(today(), a); };
function findDate(t){
  if(/بعد بكره/.test(t)) return addDays(today(), 2);
  if(/بكره|بكرا/.test(t)) return addDays(today(), 1);
  if(/النهارده|انهارده/.test(t)) return today();
  if(/امبارح|امس/.test(t)) return addDays(today(), -1);
  if(/الاسبوع الجاي/.test(t)) return nextWd(0);
  for(const [w, n] of Object.entries(WD)) if(new RegExp('(^|\\s)(يوم\\s+)?' + w + '(\\s|$)').test(t)) return nextWd(n);
  return null;
}
function findTime(t){ const m = t.match(/الساعه\s*(\d{1,2})(?:[:.](\d{2}))?\s*(الصبح|صباحا|بالليل|مساء|العصر|الضهر|بليل)?/); if(!m) return null; let h = +m[1]; const q = m[3] || ''; if(/بالليل|مساء|العصر|بليل/.test(q) && h < 12) h += 12; else if(/الضهر/.test(q) && h < 6) h += 12; else if(!q && h >= 1 && h <= 7) h += 12; return String(h).padStart(2, '0') + ':' + String(+(m[2] || 0)).padStart(2, '0'); }
function bestCat(t){ let best = null, sc = 0; for(const [k, c] of Object.entries(CATS)) for(const w of c.k) if(t.includes(norm(w)) && w.length > sc){ best = k; sc = w.length; } return best; }
function taskFrom(raw){
  const t = norm(raw);
  let title = raw.replace(/^\s*(فكّرني|فكرني|ذكّرني|ذكرني|متنساش|ماتنساش|لازم|محتاج|عايز|مهمة|مهمه)\s*/, '');
  title = title.replace(/(بعد بكرة|بعد بكره|بكرة|بكره|النهارده|يوم\s+\S+|الساعة\s*[\d٠-٩:.]+\s*(الصبح|بالليل|العصر|الضهر)?)/g, '').replace(/^(إني|اني)\s+/, '').replace(/\s{2,}/g, ' ').trim();
  return {kind:'task', title: title || raw.trim(), due: findDate(t), time: findTime(t)};
}
function parse(text){
  const t = norm(text).trim(); if(!t) return [];
  const hasNum = /\d/.test(t) || NUMW.some(([w]) => new RegExp('(^|\\s)' + w + '(\\s|$)').test(t));
  if(!hasNum || (/^(فكرني|ذكرني|متنساش|ماتنساش|لازم|محتاج|عايز|مهمه)/.test(t) && !/(دفعت|وصل|قبضت|حوشت)/.test(t))) return [taskFrom(text)];
  const parts = t.split(/\s*(?:،|,|\n|؛)\s*|\s+و(?=\s*(?:\d|دفعت|وصل|وصلني|قبضت|حوشت|وفرت|جالي|استلمت|صرفت|اشتريت|حطيت|دخل))/);
  const out = []; let last = 'expense'; const dAll = findDate(t) || today();
  for(const c of parts){
    if(!c || !c.trim()) continue;
    let amount = null; const m = c.match(/(\d+(?:\.\d+)?)\s*(الاف|الف|ك(?=\s|$))?/);
    if(m){ amount = parseFloat(m[1]); if(m[2]) amount *= 1000; } else for(const [w, v] of NUMW) if(new RegExp('(^|\\s)' + w + '(\\s|$)').test(c)){ amount = v; break; }
    if(amount === null) continue;
    let kind = last;
    if(/(حوشت|وفرت|ادخار|توفير|حطيت.*(جنب|التوفير))/.test(c)) kind = 'save';
    else if(/(وصل|وصلني|قبضت|جالي|استلمت|دخلي|تحصيل|حول لي|حولي|مرتب|راتب)/.test(c)) kind = 'income';
    else if(/(دفعت|صرفت|اشتريت|جبت)/.test(c)) kind = 'expense';
    if(kind !== 'save') last = kind;
    const usd = /(دولار|\$|usd)/.test(c), egpW = /(جنيه|egp)/.test(c);
    const d = {kind, amount, date: findDate(c) || dAll, raw: c};
    if(kind === 'income'){ d.inc = /(مرتب|راتب)/.test(c) ? 'salary' : /(عميل|تحصيل|شغل|فريلانس|حول|مشروع)/.test(c) ? 'free' : 'other'; d.currency = usd ? 'USD' : egpW ? 'EGP' : (d.inc === 'free' ? null : 'EGP'); }
    else { d.currency = usd ? 'USD' : 'EGP'; if(kind === 'expense') d.cat = bestCat(c) || 'other'; }
    out.push(d);
  }
  return out.length ? out : [taskFrom(text)];
}

/* ---------- confirm step ---------- */
let DR = [];
function probs(d){
  const p = [];
  if(d.kind === 'task'){ if(!String(d.title || '').trim()) p.push('الخطوة اسمها إيه؟'); return p; }
  if(!(d.amount > 0)) p.push('المبلغ كام؟');
  if(!d.currency) p.push('بالجنيه ولا بالدولار؟');
  if(d.currency === 'USD' && !(d.rate > 0)) p.push('الدولار بكام النهارده؟');
  return p;
}
const optH = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`;
function draftSum(d){
  if(d.kind === 'task') return [d.title, [d.due ? dayLabel(d.due) : 'من غير معاد', timeLabel(d.time)].filter(Boolean).join(' · '), 'خطوة'];
  const name = d.kind === 'expense' ? CATS[d.cat]?.n || 'مصروف' : d.kind === 'income' ? INC[d.inc] || 'دخل' : 'حوّشت';
  return [name, dayLabel(d.date) + (d.currency === 'USD' && d.rate ? ' · بسعر ' + nf2.format(d.rate) : ''), (d.kind === 'income' ? '+ ' : '') + (d.amount > 0 && d.currency ? money(d.amount, d.currency) : '؟')];
}
function draftHTML(d, i){
  const p = probs(d); if(p.length || d.editId) d.open = true;
  const [a, b, c] = draftSum(d);
  if(!d.open) return `<div class="draft"><div class="sum"><div class="grow"><b>${esc(a)}</b><div class="small muted">${esc(b)}</div></div><span class="amt">${esc(c)}</span></div><div class="row"><button class="chip" type="button" data-act="dOpen" data-i="${i}">عدّل</button><button class="chip" type="button" data-act="dDel" data-i="${i}">شيل</button></div></div>`;
  const kinds = [['expense','صرفت'],['income','دخل'],['save','حوّشت'],['task','خطوة']];
  let h = `<div class="draft"><div class="chips">${kinds.map(([k, l]) => `<button class="chip ${d.kind === k ? 'on' : ''}" type="button" data-act="dKind" data-i="${i}" data-k="${k}">${l}</button>`).join('')}</div>`;
  if(d.kind === 'task'){
    h += `<input class="in ${p.length ? 'need' : ''}" data-f="title" data-i="${i}" value="${esc(d.title || '')}" placeholder="الخطوة"><div class="row wrap"><label class="f">اليوم<input type="date" class="in" data-f="due" data-i="${i}" value="${esc(d.due || '')}"></label><label class="f">الساعة<input type="time" class="in" data-f="time" data-i="${i}" value="${esc(d.time || '')}"></label></div><label class="row small"><input type="checkbox" data-f="essential" data-i="${i}" ${d.essential ? 'checked' : ''}> ضرورية، تفضل ظاهرة في اليوم الزحمة</label>`;
  } else {
    h += `<div class="row wrap"><label class="f" style="flex:2 1 140px">المبلغ<input class="in ${d.amount > 0 ? '' : 'need'}" inputmode="decimal" data-f="amount" data-i="${i}" value="${d.amount ?? ''}"></label>
      <div class="f" style="flex:1 1 120px">العملة<div class="chips"><button type="button" class="chip ${d.currency === 'EGP' ? 'on' : ''}" data-act="dCur" data-i="${i}" data-c="EGP">جنيه</button><button type="button" class="chip ${d.currency === 'USD' ? 'on' : ''}" data-act="dCur" data-i="${i}" data-c="USD">دولار</button></div></div></div>`;
    if(d.currency === 'USD') h += `<label class="f">سعر الدولار<input class="in ${d.rate > 0 ? '' : 'need'}" inputmode="decimal" data-f="rate" data-i="${i}" value="${d.rate ?? ''}"></label>`;
    if(d.kind === 'expense') h += `<label class="f">البند<select class="in" data-f="cat" data-i="${i}">${Object.entries(CATS).map(([k, c]) => optH(k, c.n, d.cat)).join('')}</select></label>`;
    if(d.kind === 'income') h += `<label class="f">نوعه<select class="in" data-f="inc" data-i="${i}">${Object.entries(INC).map(([k, n]) => optH(k, n, d.inc)).join('')}</select></label>`;
    h += `<div class="row wrap"><label class="f">التاريخ<input type="date" class="in" data-f="date" data-i="${i}" value="${esc(d.date || today())}"></label><label class="f">ملاحظة<input class="in" data-f="note" data-i="${i}" value="${esc(d.note || '')}" placeholder="اختياري"></label></div>`;
  }
  if(p.length) h += `<div class="ask">${esc(p.join(' '))}</div>`;
  if(!d.editId) h += `<button class="chip" type="button" data-act="dDel" data-i="${i}" style="align-self:flex-start">شيل</button>`;
  return h + '</div>';
}
function showDrafts(){
  const ok = DR.length && DR.every(d => !probs(d).length); const edit = DR.length === 1 && DR[0].editId;
  sheet(`<h2>${edit ? 'تعديل' : DR.length > 1 ? `فهمت ${n0(DR.length)} حاجات` : 'دي اللي فهمتها'}</h2>
    <div style="display:flex;flex-direction:column;gap:10px">${DR.map(draftHTML).join('')}</div>
    ${edit ? `<div class="btns"><button class="kb main" type="button" data-act="dSave" ${ok ? '' : 'disabled'}><span>احفظ</span></button><button class="kb soft" type="button" data-act="txDel" data-id="${esc(edit)}">امسح</button></div>`
      : `<button class="kb main full" type="button" data-act="dSave" ${ok ? '' : 'disabled'}><span>${DR.length > 1 ? 'سجّل الكل' : 'سجّل'}</span></button>`}`);
}
function refresh(){ const sc = $('#sheet').scrollTop; showDrafts(); $('#sheet').scrollTop = sc; }
function prep(d){ d.id = d.id || uid(); if(d.currency === 'USD' && !d.rate) d.rate = rate() || null; return d; }
let lastAdded = [];
function saveDrafts(){
  const list = DR.slice(); DR = []; closeSheet(); lastAdded = []; let anyMoney = false;
  for(const d of list){
    if(d.editId){ const i = D.tx.findIndex(x => x.id === d.editId); if(i >= 0){ const t = D.tx[i]; Object.assign(t, {kind: d.kind, amount: r2(d.amount), currency: d.currency, date: d.date, note: d.note || ''}); t.cat = d.kind === 'expense' ? d.cat : undefined; t.inc = d.kind === 'income' ? d.inc : undefined; t.rate = d.currency === 'USD' ? Number(d.rate) : undefined; } continue; }
    if(d.kind === 'task'){ const t = {id: uid(), title: d.title.trim(), due: d.due || null, time: d.time || null, essential: !!d.essential, status:'open', postponed:0, createdAt: Date.now()}; D.tasks.push(t); lastAdded.push(['tasks', t.id]); continue; }
    const t = {id: uid(), kind: d.kind, amount: r2(d.amount), currency: d.currency, date: d.date || today(), createdAt: Date.now()};
    if(d.kind === 'expense') t.cat = d.cat || 'other'; if(d.kind === 'income') t.inc = d.inc || 'other';
    if(d.currency === 'USD'){ t.rate = Number(d.rate); if(t.rate !== rate()) setS({rate: t.rate, rateDate: today()}); }
    if(d.note) t.note = d.note;
    D.tx.push(t); lastAdded.push(['tx', t.id]); anyMoney = true;
  }

  teDel(el){ if(el.dataset.sure !== '1'){ el.dataset.sure = '1'; el.textContent = 'متأكد؟'; return; } D.tasks = D.tasks.filter(x => x.id !== el.dataset.id); save(); closeSheet(); renderAll(); },
  txList(){ const mk = today().slice(0, 7); const list = D.tx.filter(t => t.date.slice(0, 7) === mk).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
    sheet(`<h2>حركات ${MONTHS[new Date().getMonth()]}</h2>${list.map(t => { const [a] = draftSum(t); return `<button class="line" type="button" data-act="txEdit" data-id="${t.id}" style="background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:start"><div class="grow"><div>${esc(a)}${t.note ? ' · ' + esc(t.note) : ''}</div><div class="small muted">${dayLabel(t.date)}</div></div><b>${t.kind === 'income' ? '+ ' : ''}${money(t.amount, t.currency)}</b></button>`; }).join('') || '<div class="muted">لسه مفيش حركات الشهر ده.</div>'}`); },
  txEdit(el){ const t = D.tx.find(x => x.id === el.dataset.id); if(!t) return; DR = [Object.assign({}, t, {editId: t.id, open: true})]; showDrafts(); },
  txDel(el){ if(el.dataset.sure !== '1'){ el.dataset.sure = '1'; el.textContent = 'متأكد؟ امسح'; return; } D.tx = D.tx.filter(x => x.id !== el.dataset.id); DR = []; save(); closeSheet(); renderAll(); toast('اتمسحت.'); },
  cstep(el){ S.closeStep = +el.dataset.s; renderClose(); },
  zeroDay(){ setS({zeroDays: [...(ST().zeroDays || []), today()].slice(-60)}); S.closeStep = 1; renderAll(); },
  closeDay(){ const v = $('input[name="tm"]:checked')?.value || ''; setS({closedDays: [...(ST().closedDays || []), today()].slice(-60), tomorrowMain: v ? {date: addDays(today(), 1), id: v} : null}); S.closeStep = 0; renderAll(); toast('اليوم اتقفل. تصبح على خير.', true); },
  reopen(){ setS({closedDays: (ST().closedDays || []).filter(d => d !== today())}); renderAll(); },
  settings(){ const st = ST();
    sheet(`<h2>الإعدادات</h2>
    <label class="f">اسمك<input class="in" id="sName" value="${esc(st.name || 'أيمن')}"></label>
    <label class="f">سعر الدولار بالجنيه (للدخل اللي بالدولار)<input class="in" id="sRate" inputmode="decimal" value="${rate() || ''}"></label>
    <button class="kb main full" type="button" data-act="saveSettings"><span>احفظ</span></button>
    <div class="note small" style="background:rgba(29,36,48,.05)">بياناتك متخزنة على الموبايل ده بس، ومش بتتبعت لأي مكان. لو مسحت بيانات المتصفح أو غيّرت الموبايل هتضيع، فخد نسخة احتياطية كل فترة.${st.lastBackup ? ' آخر نسخة: ' + dayLabel(st.lastBackup) + '.' : ''}</div>
    <div class="btns"><button class="kb soft" type="button" data-act="exportData">نسخة احتياطية</button><button class="kb soft" type="button" data-act="importData">استرجاع نسخة</button></div>
    <button class="chip" type="button" data-act="wipe" style="align-self:flex-start">امسح كل البيانات</button>`); },
  saveSettings(){ const r = numIn($('#sRate').value); const patch = {name: $('#sName').value.trim() || 'أيمن'}; if(r > 0 && r !== rate()){ patch.rate = r; patch.rateDate = today(); } setS(patch); closeSheet(); renderAll(); toast('اتحفظ.', true); },
  async exportData(){ const data = JSON.stringify({app:'khatwa', v:1, at: new Date().toISOString(), data: D}); const name = `khatwa-${today()}.json`; const file = new File([data], name, {type:'application/json'});
    try { if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'نسخة خطوة'}); setS({lastBackup: today()}); renderAll(); return; } } catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setS({lastBackup: today()}); renderAll(); toast('النسخة اتحفظت.', true); },
  importData(){ $('#importFile').click(); },
  wipe(el){ if(el.dataset.sure !== '1'){ el.dataset.sure = '1'; el.textContent = 'متأكد؟ مفيش رجوع'; return; } D = {settings:{name: ST().name}, tx:[], tasks:[]}; save(); closeSheet(); renderAll(); toast('اتمسح كل حاجة.'); },
  mic(){ toggleMic(); },
};
function mostUsed(){ const c = {}; D.tx.filter(t => t.kind === 'expense' && t.date >= addDays(today(), -30)).forEach(t => c[t.cat] = (c[t.cat] || 0) + 1); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || 'food'; }

/* ---------- voice (where the phone's browser supports it) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null;
function toggleMic(){
  if(!SR) return;
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = 'ar-EG'; rec.interimResults = true; rec.continuous = false;
  const box = $('#say'); const base = box.value.trim();
  rec.onresult = e => { let s = ''; for(const r of e.results) s += r[0].transcript; box.value = (base + ' ' + s).trim(); };
  rec.onend = () => { rec = null; $('#mic')?.classList.remove('live'); };
  rec.onerror = e => { if(e.error === 'not-allowed') toast('الموبايل مش مدي إذن للمايك. اكتب عادي.'); };
  try { rec.start(); $('#mic')?.classList.add('live'); } catch(e){ rec = null; }
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(!el) return; const f = A[el.dataset.act]; if(f){ e.preventDefault(); f(el, e); } });
$('#veil').addEventListener('click', e => { if(e.target.id === 'veil'){ DR = []; closeSheet(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if(f === 'say'){ const v = $('#say').value; if(rec) rec.stop(); if(!v.trim()) return; $('#say').value = ''; $('#say').blur(); handleText(v); }
  if(f === 'newStep'){ const v = $('#newStep').value.trim(); if(!v) return; const t = {id: uid(), title: v, due: today(), status:'open', postponed:0, createdAt: Date.now()}; D.tasks.push(t); setS({todayMain: {date: today(), id: t.id}}); renderAll(); toast('دي خطوة النهارده.', true); }
});
document.addEventListener('keydown', e => { if(e.target.id === 'say' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); e.target.form.requestSubmit(); } });
$('#sheet').addEventListener('input', e => {
  const el = e.target; const f = el.dataset.f; if(!f) return; const d = DR[+el.dataset.i]; if(!d) return;
  d[f] = el.type === 'checkbox' ? el.checked : (f === 'amount' || f === 'rate') ? numIn(el.value) : (el.value || null);
  if(el.tagName === 'SELECT'){ refresh(); return; }
  const card = el.closest('.draft'); const p = probs(d); let ask = card.querySelector('.ask');
  if(p.length){ if(!ask){ ask = document.createElement('div'); ask.className = 'ask'; card.querySelector('.chip[data-act="dDel"]') ? card.insertBefore(ask, card.querySelector('.chip[data-act="dDel"]')) : card.appendChild(ask); } ask.textContent = p.join(' '); } else if(ask) ask.remove();
  if((f === 'amount' || f === 'rate') && d[f] > 0) el.classList.remove('need'); if(f === 'title' && d.title) el.classList.remove('need');
  const b = $('[data-act="dSave"]'); if(b) b.disabled = !DR.every(x => !probs(x).length);
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  try { const o = JSON.parse(await file.text()); if(o.app !== 'khatwa' || !o.data) throw 0;
    sheet(`<h2>نسترجع النسخة؟</h2><div class="muted">نسخة ${esc(String(o.at || '').slice(0, 10))}: ${n0((o.data.tx || []).length)} حركة و${n0((o.data.tasks || []).length)} خطوة. هتحل مكان اللي على الموبايل دلوقتي.</div><button class="kb main full" type="button" id="doImport"><span>استرجع</span></button>`);
    $('#doImport').onclick = () => { D = Object.assign({settings:{}, tx:[], tasks:[]}, o.data); save(); closeSheet(); renderAll(); toast('النسخة رجعت.', true); };
  } catch(err){ toast('الملف ده مش نسخة من خطوة.'); }
});
// which card is on screen
const io = new IntersectionObserver(es => { es.forEach(en => { if(en.isIntersecting && en.intersectionRatio > .6){ S.active = en.target.id; markTab(); } }); }, {root: $('#deck'), threshold: [.6]});
$$('.card').forEach(c => io.observe(c));
document.addEventListener('visibilitychange', () => { if(!document.hidden){ renderAll(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(['step', 'money', 'log', 'close'].includes(h)) goto(h); });

(function boot(){
  load();
  try { const seen = sessionStorage.getItem('khatwa_greet'); S.withName = seen !== today(); sessionStorage.setItem('khatwa_greet', today()); } catch(e){}
  const t = today(); const lo = ST().lastOpen; if(lo && lo !== t){ const g = daysBetween(lo, t); if(g >= 3) S.welcome = g; } if(lo !== t) setS({lastOpen: t});
  renderAll();
  // open straight on what fits: a shortcut if one was used, the day's close in the evening, otherwise today's step
  const h = location.hash.slice(1); const hr = new Date().getHours();
  const start = ['step', 'money', 'log', 'close'].includes(h) ? h : (hr >= 20 || hr < 3) && !(ST().closedDays || []).includes(t) ? 'close' : 'step';
  requestAnimationFrame(() => { goto(start, false); if(start === 'log') setTimeout(() => $('#say')?.focus(), 300); });
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if('serviceWorker' in navigator && location.protocol === 'https:') Promise.reject().catch(() => {});
})();
</script>
</body>
